<svg xmlns="http://www.w3.org/2000/svg" class="df" viewBox="0 0 720 492" role="img" aria-labelledby="df-t df-d">
<title id="df-t">How campus data reaches the app</title>
<desc id="df-d">Eight sources feed the GT App API, which stores data in MongoDB Atlas and sends changes to the phone at launch. Bus data goes straight from TransLoc to the phone.</desc>
