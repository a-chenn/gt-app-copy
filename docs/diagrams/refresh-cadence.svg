<svg xmlns="http://www.w3.org/2000/svg" class="rf" viewBox="0 0 720 436" role="img" aria-labelledby="rf-t rf-d">
<title id="rf-t">How often each data source refreshes</title>
<desc id="rf-d">Twelve rows show each source's backend refresh interval: live, hourly, daily, weekly, on request, or by hand. Campus locations, appliances, dining hours and academic dates are loaded by hand.</desc>
<style>
svg.rf text { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; fill: #242424; }
svg.rf .h { font-weight: 600; font-size: 10px; letter-spacing: .14em; fill: #8F713D; }
svg.rf .n { font-weight: 600; font-size: 12px; fill: #051E39; }
svg.rf .nb { font-weight: 600; font-size: 11px; fill: #051E39; }
svg.rf .s { font-weight: 400; font-size: 10.5px; fill: #515151; }
svg.rf .l { font-weight: 600; font-size: 10.5px; fill: #051E39; }
svg.rf .lg { font-weight: 600; font-size: 10.5px; fill: #8F713D; }
svg.rf .num { font-weight: 700; fill: #8F713D; }
svg.rf .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
svg.rf .w { fill: #fff; }
</style>
